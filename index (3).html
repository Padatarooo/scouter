<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スカウター Step1</title>
<style>
  :root{ --lens:#7dffb0; --lens-dim:#2f9e62; --bg:#03140c; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--lens); font-family:"Hiragino Sans","Noto Sans JP",sans-serif; }
  #stage{ position:relative; width:100%; height:100%; overflow:hidden; }
  video,canvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video{ filter:grayscale(1) sepia(1) hue-rotate(80deg) saturate(2.2) brightness(.8) contrast(1.1); }
  #hud{ position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
        display:flex; justify-content:space-between; font-size:15px; letter-spacing:.04em; text-shadow:0 0 8px #000; }
  #bar{ position:absolute; left:0; right:0; bottom:0; display:flex; gap:12px; justify-content:center;
        padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
  button{ font:inherit; font-size:17px; color:var(--lens); background:rgba(3,20,12,.75); border:1.5px solid var(--lens);
          border-radius:6px; padding:12px 22px; }
  button:active{ background:var(--lens-dim); }
  button:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  #start{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
          background:var(--bg); text-align:center; padding:24px; }
  #start h1{ margin:0; font-size:28px; letter-spacing:.12em; font-weight:700; }
  #start p{ margin:0; max-width:22em; line-height:1.7; color:#b8f5d0; }
  #msg{ min-height:1.5em; color:#ffd27d; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud"><span id="count">検出: 0人</span><span id="fps"></span></div>
  <div id="bar"><button id="flip">カメラ切替</button></div>
  <div id="start">
    <h1>スカウター</h1>
    <p>ボタンを押すとカメラが起動します。映像はこの端末の中だけで処理され、外には送信されません。</p>
    <button id="go">測定を始める</button>
    <div id="msg" role="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const video = document.getElementById("video");
const cv = document.getElementById("overlay");
const ctx = cv.getContext("2d");
const msg = document.getElementById("msg");
let facing = "environment", running = false, lastCount = 0, audioCtx = null;

// 音: iPhoneでは画面タップ後でないと鳴らないので、開始ボタンの中で初期化する
function beep(freq = 1320, dur = 0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function pipipi() { [0, 120, 240].forEach(t => setTimeout(() => beep(), t)); }

async function openCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
  video.srcObject = stream;
  await video.play();
}

function draw(dets) {
  const cw = cv.clientWidth, ch = cv.clientHeight;
  cv.width = cw; cv.height = ch;
  const vw = video.videoWidth, vh = video.videoHeight;
  // object-fit: cover と同じ拡大・ずらしを計算して、検出位置を画面座標に直す
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  ctx.clearRect(0, 0, cw, ch);
  ctx.strokeStyle = "#7dffb0"; ctx.lineWidth = 2; ctx.shadowColor = "#7dffb0"; ctx.shadowBlur = 8;
  for (const d of dets) {
    const b = d.box, x = b.x * s + ox, y = b.y * s + oy, w = b.width * s, h = b.height * s, c = Math.min(w, h) * 0.22;
    ctx.beginPath(); // 四隅だけの照準枠
    [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, dx, dy]) => {
      ctx.moveTo(px + dx * c, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * c);
    });
    ctx.stroke();
  }
}

async function loop() {
  if (!running) return;
  const t0 = performance.now();
  const dets = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }));
  draw(dets);
  document.getElementById("count").textContent = "検出: " + dets.length + "人";
  document.getElementById("fps").textContent = Math.round(1000 / (performance.now() - t0)) + " fps";
  if (lastCount === 0 && dets.length > 0) pipipi(); // 顔を見つけた瞬間にピピピ(音の動作確認)
  lastCount = dets.length;
  requestAnimationFrame(loop);
}

document.getElementById("go").onclick = async () => {
  try {
    msg.textContent = "準備中です…";
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await openCamera();
    document.getElementById("start").hidden = true;
    running = true; loop();
  } catch (e) {
    msg.textContent = "起動できませんでした。カメラの許可をオンにして、もう一度押してください。(" + e.message + ")";
  }
};
document.getElementById("flip").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  try { await openCamera(); } catch (e) { msg.textContent = e.message; }
};
</script>
</body>
</html>
