<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>リアルタイム翻訳</title>
<style>
  :root{ --en:#e9fff1; --ja:#7dffb0; --dim:#8fb9a0; --fs:26px; }
  *{ box-sizing:border-box; touch-action:manipulation; -webkit-text-size-adjust:100%; text-size-adjust:100%; }   /* ダブルタップのズームと、横向きで文字が自動で大きくなるのを止める */
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; background:#000; color:var(--en); font-family:"Hiragino Sans","Noto Sans JP",sans-serif; }
  /* 画面全体(#stage): 字幕とボタンの層。ここだけを回す(背景のカメラ #cam は回さない)。大きさと向きは、JSが画面に合わせて決める。--sat/sar/sab/sal は、切り欠きなどの余白(回したときは向きに合わせて入れかわる) */
  #stage{ position:fixed; z-index:1; left:0; top:0; width:100%; height:100%; overflow:hidden; transform-origin:0 0;
          --sat:0px; --sar:0px; --sab:0px; --sal:0px; }
  #cam{ position:fixed; z-index:0; left:0; top:0; width:100%; height:100%; object-fit:cover; background:#000; }   /* カメラは、いつも画面いっぱい。回さない */
  #app{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
        padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) calc(var(--sab) + 10px) calc(var(--sal) + 14px); }
  #probe{ position:fixed; left:0; top:0; visibility:hidden; pointer-events:none;
          padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #top{ flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:2.4em; }
  #settingsBtn{ flex:none; padding:7px 10px; line-height:0; color:#ff6b6b; border-color:#ff6b6b; }   /* 開発用ボタンは赤い歯車 */
  #settingsBtn svg{ width:22px; height:22px; fill:currentColor; display:block; }
  #status{ flex:1; min-width:0; font-size:14px; color:var(--dim); min-height:1.6em; }
  #status.warn{ color:#ffd27d; }
  #status.live::before{ content:"● "; color:#ff5a5a; }

  /* 字幕: 下地は敷かず、文字だけ(ふちに影をつけて読みやすくする)。聞こえた言葉は小さく、翻訳は大きく */
  #log{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:8px 0; }
  .pair{ margin-top:.8em; opacity:.6; }
  .pair:last-child{ opacity:1; }
  .en{ color:var(--en); }
  .ja{ color:var(--ja); }
  .src{ font-size:calc(var(--fs) * .78); line-height:1.4; overflow-wrap:anywhere; }
  .dst{ font-size:var(--fs); line-height:1.4; margin-top:.15em; font-weight:600; overflow-wrap:anywhere; }
  .dst.err{ color:#ffd27d; font-size:calc(var(--fs) * .6); font-weight:400; }
  #log:not(.show-en) .en{ display:none; }
  #log:not(.show-ja) .ja{ display:none; }
  .hint{ color:#e4f7ec; font-size:15px; line-height:1.7; }
  #log, #interim, #status{ text-shadow:0 0 3px #000, 0 1px 4px rgba(0,0,0,.9); }
  #interim{ flex:none; min-height:1.5em; font-size:calc(var(--fs) * .7); font-style:italic; color:var(--dim); overflow-wrap:anywhere; }

  /* 操作 */
  #panel{ flex:none; display:flex; flex-direction:column; gap:8px; padding-top:8px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  button, input{ font:inherit; font-size:16px; border-radius:8px; }
  button{ color:var(--ja); background:#06180f; border:1.5px solid var(--ja); padding:10px 14px; }
  button:active{ background:#1b5c3b; }
  button:focus-visible, input:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  button.on{ background:#14452c; }
  button.mode{ flex:1; line-height:1.3; padding:10px 8px; }
  button.mode small{ display:block; font-size:12px; color:var(--dim); }
  button.mode.on{ border-width:2.5px; background:#1b5c3b; color:#fff; }
  button.mode.on small{ color:#cfeedd; }
  button.mode.rec{ border-color:#ff7a6a; }   /* 聞いている(マイクがオン)ほうのボタン */
  input{ flex:1; min-width:0; color:var(--en); background:#06180f; border:1.5px solid #2f9e62; padding:10px 12px; }
  #show{ position:absolute; z-index:5; right:calc(var(--sar) + 12px); bottom:calc(var(--sab) + 12px); padding:8px 12px; opacity:.85; }
  button.half{ flex:1; }
  .row.ends{ justify-content:space-between; }   /* 左端と右端に寄せる */
  button.mini{ font-size:13px; padding:6px 10px; }   /* 小さめのボタン */

  /* 設定シート: 下から「ひゅん」と出てきて、中のボタンが左右から「ひゅんひゅん」と飛んでくる */
  #sheet{ position:absolute; inset:0; z-index:20; }
  #backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.4); opacity:0; transition:opacity .25s; }
  #sheet.open #backdrop{ opacity:1; }
  #sheetBody{ position:absolute; left:calc(var(--sal) + 10px); right:calc(var(--sar) + 10px); top:calc(var(--sat) + 58px);   /* 上から出る。位置は、開くときに歯車の真下へ合わせる */
              transform-origin:top right; transform:translateY(-120%) scale(.9); opacity:0; }
  #sheetBody.scroll{ overflow-y:auto; overflow-x:hidden; }   /* 背の低い画面で、はみ出すときだけ上下にスクロール */
  #sheet.open #sheetBody{ animation:swoosh .5s cubic-bezier(.2,1.35,.4,1) forwards; }
  #sheet.closing #sheetBody{ animation:away .22s ease-in forwards; }
  .sheetPanel{ background:#06180f; border:1.5px solid var(--ja); border-radius:16px; padding:14px; }
  .sheetFoot{ display:flex; justify-content:flex-end; margin-top:8px; }   /* 「閉じる」は枠の外、右下 */
  .sheetFoot button{ padding:10px 22px; }
  .sheetTitle{ font-size:15px; color:var(--dim); margin:0 0 10px 2px; letter-spacing:.1em; }
  .sheetGrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }   /* 6列: 上の3つは2列ずつ、A＋とA−は2列ぶんの幅で中央に並べる */
  .sheetGrid button{ grid-column:span 2; padding:14px 4px; font-size:15px; line-height:1.25; }   /* せまい画面では、文字が2行に折り返す */
  #fsUp{ grid-column:2 / span 2; }
  #fsDown{ grid-column:4 / span 2; }
  #topBtns{ display:flex; align-items:center; gap:8px; flex:none; }
  /* 開発用メニューの「よく使う」4つ: 上に大きく、わかりやすく */
  .favLabel{ font-size:12px; color:#ff9a8a; letter-spacing:.1em; margin:0 2px 6px; }
  .favGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .favGrid button{ padding:16px 6px; font-size:17px; font-weight:600; border-width:2px; }
  .sheetDivider{ height:1px; background:rgba(125,255,176,.25); margin:12px 0; }
  #sheet .sheetTitle{ color:#ff8a7a; }
  #rotBtn{ border-width:2px; background:#12402a; color:#eafff3; box-shadow:0 0 10px rgba(125,255,176,.4); }   /* 回転ボタンは、ほんの少しだけ強調 */
  #sheet.open .favGrid button, #sheet.open .sheetGrid button, #sheet.open .sheetFoot button{ animation:hyun .45s cubic-bezier(.2,1.5,.35,1) both; animation-delay:calc(var(--i) * 45ms + 100ms); }
  @keyframes swoosh{
    0%{ transform:translateY(-120%) scale(.9) skewX(8deg); opacity:0; }
    60%{ transform:translateY(6px) scale(1.01) skewX(-2deg); opacity:1; }
    100%{ transform:none; opacity:1; }
  }
  @keyframes away{ from{ transform:none; opacity:1; } to{ transform:translateY(-120%) scale(.9) skewX(8deg); opacity:0; } }
  @keyframes hyun{
    from{ opacity:0; transform:translateX(calc(var(--dir) * 80px)) scale(.6) skewX(calc(var(--dir) * -14deg)); }
    to{ opacity:1; transform:none; }
  }
  @media (prefers-reduced-motion: reduce){   /* 動きが苦手な人向け: 動かさずに表示する */
    #sheet.open #sheetBody, #sheet.closing #sheetBody, #sheet.open .favGrid button, #sheet.open .sheetGrid button, #sheet.open .sheetFoot button{ animation:none; }
    #sheetBody, #fBody{ transform:none; opacity:1; }
    #facesheet.open #fBody, #facesheet.closing #fBody, #faceInfo{ animation:none; }
    #backdrop{ transition:none; }
  }
  /* 横長のとき(スマホを横にしたとき、または回転ボタンで横にしたとき)の並び */
  #stage.wide #panel{ display:grid; grid-template-columns:auto 1fr; align-items:stretch; }   /* 上の段: 小さなボタン + 入力欄と翻訳 / 下の段: 言語ボタン */
  #stage.wide .row.ends{ grid-column:1; grid-row:1; flex-wrap:nowrap; align-items:center; }
  #stage.wide .row.test{ grid-column:2; grid-row:1; flex-wrap:nowrap; }
  #stage.wide .row.modes{ grid-column:1 / span 2; grid-row:2; flex-wrap:nowrap; }
  #stage.wide .favGrid{ grid-template-columns:repeat(4,1fr); }
  #stage.wide .favGrid button{ padding:12px 4px; font-size:15px; }
  #stage.wide #sheetBody{ left:auto; width:min(520px, calc(100% - var(--sal) - var(--sar) - 20px)); }

  /* ---- 顔の保存と認識 ---- */
  #objCv{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }   /* 物体の枠と名前(顔の枠と同じ高さ) */
  #faceCv{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }   /* 顔の枠と名前札(カメラの上、字幕とボタンの下) */
  #toast{ position:absolute; z-index:30; left:50%; top:calc(var(--sat) + 52px); transform:translateX(-50%); width:max-content; max-width:calc(100% - 28px);
          padding:8px 16px; text-align:center; font-size:14px; line-height:1.5; color:#ffe3a8; background:rgba(6,24,15,.88); border:1px solid rgba(255,210,125,.5);
          border-radius:999px; pointer-events:none; opacity:0; transition:opacity .25s; }
  #toast.show{ opacity:1; }
  button.danger{ color:#ff9a8a; border-color:#ff9a8a; }
  .avatar{ flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:20px; color:#04140c;
           background:hsl(var(--h, 150) 70% 68%); box-shadow:0 0 14px hsl(var(--h, 150) 85% 60% / .55); }
  /* 選んだ顔の情報カード(すりガラス風) */
  #faceInfo{ flex:none; display:flex; align-items:center; gap:10px; margin-top:8px; padding:10px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.2); border-left:3px solid #ff6b6b;
             background:rgba(6,24,15,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); animation:cardIn .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:none; } }
  #faceInfo .fbody{ flex:1; min-width:0; }
  #faceInfo .fname{ display:flex; align-items:center; gap:8px; font-size:18px; font-weight:600; }
  #faceInfo .fname span.n{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip{ flex:none; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.3); color:#cfe9da; }
  .chip.ok{ color:#04140c; background:#7dffb0; border-color:#7dffb0; }
  #faceInfo .fmemo{ margin-top:3px; font-size:14px; line-height:1.5; color:#d6ffe6; white-space:pre-wrap; overflow-wrap:anywhere;
                    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  #faceInfo .fmemo.none{ color:#9bc4ab; }
  /* 顔の一覧(設定と同じように、上から出てくる) */
  #facesheet{ position:absolute; inset:0; z-index:22; }
  #fBackdrop{ position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; transition:opacity .25s; }
  #facesheet.open #fBackdrop{ opacity:1; }
  #fBody{ position:absolute; left:calc(var(--sal) + 10px); right:calc(var(--sar) + 10px); top:calc(var(--sat) + 58px); bottom:calc(var(--sab) + 10px);
          display:flex; flex-direction:column; transform-origin:top right; transform:translateY(-120%) scale(.9); opacity:0; }
  #facesheet.open #fBody{ animation:swoosh .5s cubic-bezier(.2,1.35,.4,1) forwards; }
  #facesheet.closing #fBody{ animation:away .22s ease-in forwards; }
  .facePanel{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#06180f; border:1.5px solid var(--ja); border-radius:16px; padding:14px; }
  .fNote{ font-size:12px; line-height:1.6; color:var(--dim); margin:0 2px 12px; }
  .fEmpty{ color:#cfe9da; text-align:center; padding:28px 8px; line-height:1.7; }
  .pcard{ display:flex; gap:10px; align-items:flex-start; padding:10px; margin-bottom:10px; border-radius:14px; border:1px solid rgba(125,255,176,.28);
          background:linear-gradient(135deg, rgba(125,255,176,.12), rgba(125,255,176,.03)); }
  .pbody{ flex:1; min-width:0; }
  .pname{ display:flex; align-items:center; gap:6px; }
  .pname b{ flex:1; min-width:0; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pmeta{ font-size:12px; color:var(--dim); margin:2px 0 6px; }
  .pcard textarea{ display:block; width:100%; min-height:60px; resize:vertical; font:inherit; font-size:16px; color:#d6ffe6; background:rgba(3,20,12,.7); border:1px solid #2f9e62; border-radius:8px; padding:8px; }
  .pcard textarea:focus{ outline:2px solid var(--ja); }
  .fWipe{ text-align:center; padding-top:4px; }
  #stage.wide #fBody{ left:auto; width:min(560px, calc(100% - var(--sal) - var(--sar) - 20px)); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="probe"></div>
<video id="cam" playsinline muted autoplay></video>
<div id="stage">
<canvas id="objCv"></canvas>
<canvas id="faceCv"></canvas>
<div id="app">
  <div id="top">
    <div id="status" role="status">待機中</div>
    <div id="topBtns">
      <button id="facesBtn" class="mini">顔の一覧</button>
    <button id="settingsBtn" aria-label="開発用メニュー" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
    </div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div id="interim"></div>
  <div id="faceInfo" hidden></div>
  <div id="panel">
    <div class="row ends">
      <button id="clear" class="mini">文字リセット</button>
      <button id="regBtn" class="mini">顔を登録</button>
    </div>
    <div class="row modes">
      <button id="mAuto" class="mode" hidden>聞く<small id="mAutoSub">日本語 ⇄ 英語 自動</small></button>
      <button id="mEn" class="mode">英語を聞く<small id="mEnSub">→ 日本語に翻訳</small></button>
      <button id="mJa" class="mode">日本語を聞く<small id="mJaSub">→ 英語に翻訳</small></button>
    </div>
    <div class="row test">
      <input id="txt" type="text" enterkeyhint="send" autocapitalize="off" autocomplete="off">
      <button id="send">翻訳</button>
    </div>
  </div>
</div>
<button id="show" hidden>操作</button>

<div id="sheet" hidden role="dialog" aria-label="開発用メニュー">
  <div id="backdrop"></div>
  <div id="sheetBody">
    <div class="sheetPanel">
    <div class="sheetTitle">開発用</div>
    <div class="favLabel">よく使う</div>
    <div class="favGrid">
      <button id="camBtn" class="fav" style="--i:0; --dir:-1">内カメ OFF</button>
      <button id="rotBtn" class="fav" style="--i:1; --dir:1" aria-label="画面の向きを切り替える" aria-pressed="false">回転</button>
      <button id="faceOnBtn" class="fav" style="--i:2; --dir:-1">顔認識 ON</button>
      <button id="hide" class="fav" style="--i:3; --dir:1">操作を隠す</button>
    </div>
    <div class="sheetDivider"></div>
    <div class="sheetGrid">
      <button id="tJa" style="--i:4; --dir:-1">日本語 ON</button>
      <button id="tEn" style="--i:5; --dir:1">英語 ON</button>
      <button id="tTts" style="--i:6; --dir:-1">読み上げ OFF</button>
      <button id="objOnBtn" style="--i:9; --dir:1">物体認識 ON</button>
      <button id="fsUp" style="--i:7; --dir:1" aria-label="文字を大きく">A＋</button>
      <button id="fsDown" style="--i:8; --dir:-1" aria-label="文字を小さく">A−</button>
    </div>
    </div>
    <div class="sheetFoot"><button id="sheetClose" style="--i:10; --dir:1">閉じる</button></div>
  </div>
</div>

<div id="facesheet" hidden role="dialog" aria-label="顔の一覧">
  <div id="fBackdrop"></div>
  <div id="fBody">
    <div class="facePanel">
      <div class="sheetTitle">顔の一覧(<span id="fCount">0</span>人)</div>
      <div class="fNote">顔の特徴の数値だけをこの端末の中に保存します。写真は保存せず、外にも送信しません。登録は、本人の了承をもらってからにしてください。</div>
      <div id="fList"></div>
      <div class="fWipe"><button id="fWipe" class="mini danger">全削除</button></div>
    </div>
    <div class="sheetFoot"><button id="fClose">閉じる</button></div>
  </div>
</div>

<div id="toast" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script type="module">
  import("https://cdn.jsdelivr.net/npm/@soniox/client@2.1.0/+esm").then(m => { window.SonioxClient = m.SonioxClient; }).catch(e => console.warn("Sonioxを読み込めませんでした", e));
</script>
<script>
const $ = id => document.getElementById(id);
for (const t of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(t, e => e.preventDefault());   // 2本指の拡大縮小を止める(うっかりのズーム対策)
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- 設定(ここを書き換えれば調整できます) ----
const CAM_FIT = "cover";       // カメラの映像の収め方。"cover" = 画面いっぱい(はしが少し切れる) / "contain" = 全体を収める(黒い帯が出る)
const MYMEMORY_EMAIL = "";     // 自分のメールアドレスを入れると、翻訳の無料枠が1日5,000文字 → 50,000文字に増える
const TMP_KEY_URL = "https://soniox-proxy.jojo31503150.workers.dev";        // Cloudflare Worker(鍵を預かる中継)のアドレス。入れると、Sonioxで日本語と英語を自動で聞き分けます。空のままなら、これまでのiPhone内蔵の音声認識(ボタンで言語を切り替え)を使います
const STT_TERMS = [];          // よく出る名前・地名など(聞き取りの助けになる)。例: ["New York", "Times Square"]
const SONIOX_IDLE_MS = 300000; // 音が何もない状態がこの時間続いたら、料金がかからないよう自動で止める(5分)
const SONIOX_ON = !!TMP_KEY_URL;
const MAX_LINES = 6;           // 画面に残す文の数
const PAUSE_MS = 1500;         // 話が止まってから、この時間たったら区切って翻訳する
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// 聞く言語ごとの設定。en = 英語を聞いて日本語にする / ja = 日本語を聞いて英語にする
const MODES = {
  en: { lang: "en-US", pair: "en|ja", speak: "ja-JP", src: "en", dst: "ja", label: "英語", label_to: "日本語", test: "テスト用: 英語を入力して翻訳" },
  ja: { lang: "ja-JP", pair: "ja|en", speak: "en-US", src: "ja", dst: "en", label: "日本語", label_to: "英語", test: "テスト用: 日本語を入力して翻訳" }
};

let settings = { en: true, ja: true, tts: false, fs: 26, mode: "en", rot: 0, faceOn: true, objOn: true, cam: "environment" };
try { Object.assign(settings, JSON.parse(localStorage.getItem("listen.settings") || "{}")); } catch (e) {}
if (!MODES[settings.mode]) settings.mode = "en";
if (![0, 90].includes(settings.rot)) settings.rot = 0;   // 向きは、0度と90度だけ
if (!["user", "environment"].includes(settings.cam)) settings.cam = "environment";   // user = 内カメ(自分側) / environment = 背面カメラ
const saveSettings = () => { try { localStorage.setItem("listen.settings", JSON.stringify(settings)); } catch (e) {} };

// ---- 翻訳(MyMemory: 登録なしで使える無料のサービス。あとで別のものに差しかえられるよう、ここにまとめています) ----
const cache = new Map();
const decode = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
const byteLen = s => new TextEncoder().encode(s).length;
function chunk(text, maxBytes = 450) {   // 1回に送れる長さ(バイト)に限りがあるので、文の区切りで分ける。日本語は1文字が3バイト
  const parts = text.match(/[^.!?。！？]+[.!?。！？]*\s*/g) || [text], out = [];
  let cur = "";
  for (const p of parts) { if (cur && byteLen(cur + p) > maxBytes) { out.push(cur.trim()); cur = p; } else cur += p; }
  if (cur.trim()) out.push(cur.trim());
  const res = [];
  for (const c of out) {
    if (byteLen(c) <= maxBytes) { res.push(c); continue; }
    let buf = "";   // 1文が長すぎるときは、文字ずつ数えて強制的に分ける
    for (const ch of c) { if (byteLen(buf + ch) > maxBytes) { res.push(buf); buf = ch; } else buf += ch; }
    if (buf) res.push(buf);
  }
  return res;
}
async function translateOne(q, pair) {
  const key = pair + "|" + q;
  if (cache.has(key)) return cache.get(key);
  const params = new URLSearchParams({ q, langpair: pair });
  if (MYMEMORY_EMAIL) params.set("de", MYMEMORY_EMAIL);
  const r = await fetch("https://api.mymemory.translated.net/get?" + params);
  const j = await r.json();
  if (String(j.responseStatus) !== "200") throw new Error(j.responseDetails || ("status " + j.responseStatus));
  const out = decode(j.responseData.translatedText || "");
  if (/MYMEMORY WARNING/i.test(out)) throw new Error("quota");
  cache.set(key, out);
  return out;
}
async function translate(text, mode) {
  const m = MODES[mode], parts = [];
  for (const c of chunk(text)) parts.push(await translateOne(c, m.pair));
  return parts.join(m.dst === "en" ? " " : "");   // 英語はスペースでつなぐ
}
function errMsg(e) {
  const m = String(e && e.message || e);
  if (/quota|ALL AVAILABLE|429/i.test(m)) return "今日の無料の翻訳の上限に達しました";
  if (e && e.name === "TypeError") return "ネットワークにつながっていません";
  return "翻訳できませんでした";
}

let lines = [];

function setInterim(t) { $("interim").textContent = t ? t + " …" : ""; }

  $("objOnBtn").textContent = "物体認識 " + (settings.objOn ? "ON" : "OFF"); $("objOnBtn").classList.toggle("on", settings.objOn);   // 物体認識(いらなければ、この行も消す)
  $("camBtn").textContent = "内カメ " + (settings.cam === "user" ? "ON" : "OFF"); $("camBtn").classList.toggle("on", settings.cam === "user");
  $("txt").placeholder = MODES[settings.mode].test;
  $("mAuto").classList.toggle("on", sonioxOn); $("mAuto").classList.toggle("rec", sonioxOn);   // 聞いているときだけ、明るく・赤くする

function render() {
  const log = $("log");
  log.className = (settings.en ? "show-en " : "") + (settings.ja ? "show-ja" : "");
  const L = liveItem();   // いま聞き取り中の文(途中経過)
  if (!lines.length && !L) {
    log.innerHTML = SONIOX_ON ? '<div class="hint">「聞く」を押すと、マイクがオンになります。日本語が聞こえたら英語に、英語が聞こえたら日本語に、自動で翻訳します。<br>もう一度押すと、オフになります。<br>※ホーム画面に追加したアプリでは、マイクが使えないことがあります。Safariで開いてください。</div>' : '<div class="hint">下のボタンを押すと、マイクがオンになります。もう一度同じボタンを押すと、オフになります。<br>・英語を聞く: 相手の英語を、日本語にします<br>・日本語を聞く: 自分の日本語を、英語にします<br>聞いている途中で、もう一方のボタンを押すと、聞く言葉が切り替わります。<br>※ホーム画面に追加したアプリでは音声認識が使えません。Safariで開いてください。</div>';
    return;
  }
  const items = L ? [...lines.slice(-(MAX_LINES - 1)), L] : lines.slice(-MAX_LINES);
  log.innerHTML = items.map(l => {
    const m = MODES[l.mode];
    const dst = l.err ? `<div class="dst err">${esc(l.err)}</div>` : `<div class="dst ${m.dst}">${l.dst == null ? "…" : esc(l.dst)}</div>`;
    return `<div class="pair"><div class="src ${m.src}">${esc(l.src)}</div>${dst}</div>`;
  }).join("");
}

// ---- 翻訳した言葉の読み上げ(iPhoneに入っている読み上げ機能) ----
function speakText(text, lang) {
  if (!settings.tts || !("speechSynthesis" in window) || !text) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = lang;
  if (sonioxOn && sonioxRec) {   // 読み上げの声を、マイクが聞き取って翻訳しないよう、読み上げ中は聞き取りを止める
    u.onstart = () => { try { sonioxRec && sonioxRec.pause(); } catch (e) {} };
    u.onend = u.onerror = () => { try { if (sonioxOn && sonioxRec) sonioxRec.resume(); } catch (e) {} };
  }
  speechSynthesis.speak(u);
}

// ---- 1文ぶんを追加して、翻訳する ----
let lastNorm = "", lastAt = 0;
function addLine(src, mode) {
  const line = { src, dst: null, err: null, mode };
  lines.push(line); if (lines.length > MAX_LINES * 3) lines.shift();
  render();
  translate(src, mode).then(dst => { line.dst = dst; render(); speakText(dst, MODES[mode].speak); })
    .catch(e => { console.warn(e); line.err = errMsg(e); render(); });
}
function commit(t, mode) {   // 同じ内容が2回届いても、1回だけ出す
  t = t.replace(/\s+/g, " ").trim(); if (!t) return;
  const now = Date.now(), norm = mode + "|" + t.toLowerCase();
  const prev = lastNorm.startsWith(mode + "|") ? lastNorm.slice(mode.length + 1) : "";
  if (prev && now - lastAt < 5000) {
    const cur = norm.slice(mode.length + 1);
    if (cur === prev || prev.startsWith(cur)) return;
    if (cur.startsWith(prev)) t = t.slice(prev.length).trim();   // 同じ文の続きだけを足す
  }
  if (!t) return;
  lastNorm = norm; lastAt = now;
  addLine(t, mode);
}

// ---- 音声認識(選んだ言語を聞き取る) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, sessionMode = settings.mode, interimText = "", pauseTimer = 0, restartTimer = 0, wakeLock = null;

function ensureRec() {
  if (rec) return rec;
  rec = new SR();
  rec.interimResults = true; rec.maxAlternatives = 1;
  rec.continuous = !IS_IOS;   // iPhoneは「1回ずつ区切って、自動で聞き直す」ほうが安定する
  rec.onstart = () => { interimText = ""; setInterim(""); };
  rec.onresult = e => {
    if (settings.tts && "speechSynthesis" in window && speechSynthesis.speaking) return;   // 読み上げの声を、聞き取りに使わない
    let part = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i], t = r[0].transcript.trim();
      if (r.isFinal) commit(t, sessionMode); else part += (part ? " " : "") + t;
    }
    interimText = part; setInterim(part);
    clearTimeout(pauseTimer);
    if (part) pauseTimer = setTimeout(flushInterim, PAUSE_MS);
  };
  rec.onerror = e => {
    const c = e.error;
    if (c === "no-speech" || c === "aborted") return;
    if (c === "not-allowed") stopListening("マイクが許可されていません。設定でSafariのマイクを許可してください。", true);
    else if (c === "service-not-allowed") stopListening("音声認識が許可されていません。設定の「一般」→「キーボード」で「音声入力」をオンにしてください。", true);
    else if (c === "audio-capture") stopListening("マイクが見つかりません。", true);
    else if (c === "network") stopListening("ネットワークにつながっていないため、音声認識が使えません。", true);
    else if (c === "language-not-supported") stopListening("この言語の音声認識は、この端末で使えません。", true);
    else console.warn("recognition error", c);
  };
  rec.onend = () => {
    clearTimeout(pauseTimer);
    if (interimText) { commit(interimText, sessionMode); interimText = ""; setInterim(""); }   // 終わる前に残っていた分も出す(切り替え前の言語として)
    if (listening) { clearTimeout(restartTimer); restartTimer = setTimeout(startRec, 150); }
  };
  return rec;
}
function startRec() {
  if (!listening) return;
  const prev = sessionMode;
  try {
    const r = ensureRec();
    sessionMode = settings.mode;
    r.lang = MODES[sessionMode].lang;   // 始めるたびに、いま選んでいる言語にする
    r.start();
    setStatus("聞いています(" + MODES[sessionMode].label + ")", false, true);
  } catch (e) { sessionMode = prev; /* すでに開始している場合は何もしない */ }
}
function flushInterim() {   // 話が止まったまま確定しないとき、ここで区切る
  if (!interimText) return;
  commit(interimText, sessionMode); interimText = ""; setInterim("");
  try { rec.stop(); } catch (e) {}   // 終わると自動で聞き直す
}
async function keepAwake(on) {   // 聞いている間は、画面が暗くならないようにする
  try {
    if (on && navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
function startListening() {
  if (!SR) return setStatus("このブラウザは音声認識に対応していません。iPhoneのSafariで開いてください。(テスト用の入力欄は使えます)", true);
  listening = true;
  syncButtons();
  keepAwake(true); startRec();
}
function stopListening(message, warn) {
  listening = false; clearTimeout(restartTimer); clearTimeout(pauseTimer);
  if (rec) { try { rec.stop(); } catch (e) {} }
  if (interimText) { commit(interimText, sessionMode); interimText = ""; }
  setInterim("");
  syncButtons();
  keepAwake(false);
  setStatus(message || "停止中", !!warn);
}
function onModeButton(m) {   // 言語のボタン: 止まっていれば聞き始める / 同じボタンをもう一度で止める / もう一方のボタンなら言語を切り替える
  if (listening && settings.mode === m) { stopListening(); return; }
  const changed = settings.mode !== m;
  if (changed) { settings.mode = m; saveSettings(); }
  if (listening) {   // いまの区切りで終わらせて、新しい言語で聞き直す
    syncButtons();
    if (rec) { clearTimeout(pauseTimer); try { rec.stop(); } catch (e) {} }
  } else startListening();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && listening) { keepAwake(true); startRec(); } });

// ---- 画面の向き(回転): 字幕とボタンだけを、0度と90度で切り替える(カメラの映像は回さない) ----
function measureInsets() {   // 切り欠きなどの余白を測り、回しているときは向きに合わせて入れかえる
  const cs = getComputedStyle($("probe")), px = v => parseFloat(v) || 0;
  const d = { t: px(cs.paddingTop), r: px(cs.paddingRight), b: px(cs.paddingBottom), l: px(cs.paddingLeft) }, a = settings.rot;
  const m = a === 0 ? [d.t, d.r, d.b, d.l] : a === 90 ? [d.r, d.b, d.l, d.t] : a === 180 ? [d.b, d.l, d.t, d.r] : [d.l, d.t, d.r, d.b];
  const st = $("stage").style;
  st.setProperty("--sat", m[0] + "px"); st.setProperty("--sar", m[1] + "px"); st.setProperty("--sab", m[2] + "px"); st.setProperty("--sal", m[3] + "px");
}
function layoutStage() {
  const W = window.innerWidth, H = window.innerHeight, a = settings.rot, st = $("stage"), swap = a === 90 || a === 270;
  st.style.width = (swap ? H : W) + "px"; st.style.height = (swap ? W : H) + "px";
  st.style.transform = a === 0 ? "none" : a === 90 ? `translateX(${W}px) rotate(90deg)` : a === 180 ? `translate(${W}px,${H}px) rotate(180deg)` : `translateY(${H}px) rotate(270deg)`;
  measureInsets();
  st.classList.toggle("wide", st.clientWidth > st.clientHeight);   // 横長のときは、横長用の並びにする
  if (!$("sheet").hidden) positionSheet();
}
addEventListener("resize", layoutStage);
addEventListener("orientationchange", () => setTimeout(layoutStage, 200));

// ---- カメラ(背景) ----
let camStream = null;
function camFail() { if (!listening) setStatus("カメラを使えません。背景は黒になります。(カメラの許可を確認してください)", true); }
async function startCamera() {
  const v = $("cam");
  if (camStream && camStream.getTracks().some(t => t.readyState === "live")) { v.play().catch(() => {}); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: settings.cam }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });   // 背面カメラ(内カメのときは自分側)。16:9にして、画面いっぱいに広げたときの拡大を小さくする
    v.style.objectFit = CAM_FIT;
    v.style.transform = settings.cam === "user" ? "scaleX(-1)" : "none";   // 内カメは、鏡のように左右を反転して映す
    v.srcObject = camStream; await v.play();
    if (settings.faceOn) loadFaceModels();   // カメラが映ったら、顔認識の準備を始める
  } catch (e) { console.warn(e); camStream = null; camFail(); }
}
document.addEventListener("pointerdown", () => { if (!camStream) startCamera(); });   // 最初に許可できなかったとき、画面を触ったらもう一度ためす
document.addEventListener("visibilitychange", () => { if (!document.hidden) startCamera(); });

// ---- 設定シート ----
function positionSheet() {   // 設定の窓を、歯車のすぐ下に合わせる(画面を回していても、画面の中の座標で測る)
  const g = $("settingsBtn"), b = $("sheetBody"), top = g.offsetTop + g.offsetHeight + 8;
  b.classList.remove("scroll"); b.style.top = top + "px"; b.style.maxHeight = Math.max(120, $("stage").clientHeight - top - 10) + "px";
  b.classList.toggle("scroll", b.scrollHeight > b.clientHeight + 1);
}
function openSheet() {
  const s = $("sheet");
  s.hidden = false; positionSheet();
  s.classList.remove("closing"); void s.offsetWidth; s.classList.add("open");   // 動きを最初からやり直す
  $("settingsBtn").setAttribute("aria-expanded", "true");
}
function closeSheet() {
  const s = $("sheet"); if (s.hidden) return;
  s.classList.add("closing"); s.classList.remove("open");
  $("settingsBtn").setAttribute("aria-expanded", "false");
  setTimeout(() => { if (s.classList.contains("closing")) { s.hidden = true; s.classList.remove("closing"); } }, 260);
}
$("settingsBtn").onclick = () => $("sheet").hidden || $("sheet").classList.contains("closing") ? openSheet() : closeSheet();
$("sheetClose").onclick = closeSheet;
$("backdrop").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeFaces(); } });

// ---- ボタン ----
$("mEn").onclick = () => onModeButton("en");
$("mJa").onclick = () => onModeButton("ja");
$("clear").onclick = () => { lines = []; lastNorm = ""; resetLive(); render(); };
$("tEn").onclick = () => { settings.en = !settings.en; if (!settings.en && !settings.ja) settings.ja = true; saveSettings(); syncButtons(); render(); };
$("tJa").onclick = () => { settings.ja = !settings.ja; if (!settings.en && !settings.ja) settings.en = true; saveSettings(); syncButtons(); render(); };
$("tTts").onclick = () => {
  settings.tts = !settings.tts; saveSettings(); syncButtons();
  if (settings.tts && "speechSynthesis" in window) speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance("読み上げをオンにしました"), { lang: "ja-JP" }));   // iPhoneでは、ボタンを押したときに一度声を出しておく必要がある
  else if ("speechSynthesis" in window) speechSynthesis.cancel();
};
let camSwitching = false;
async function toggleCam() {   // 内カメ(自分側のカメラ)と背面カメラを切り替える
  if (camSwitching) return; camSwitching = true;
  const prev = settings.cam;
  settings.cam = prev === "user" ? "environment" : "user"; saveSettings(); syncButtons();
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  faceMap.clear(); faceList = []; selFace = null;   // 前のカメラの顔の枠を引きずらない
  await startCamera();
  if (!camStream) {   // 切り替えられなかったら、元に戻す
    settings.cam = prev; saveSettings(); syncButtons(); toast("カメラを切り替えられませんでした");
    await startCamera();
  }
  camSwitching = false;
}
$("camBtn").onclick = toggleCam;
$("rotBtn").onclick = () => { settings.rot = settings.rot === 0 ? 90 : 0; saveSettings(); syncButtons(); layoutStage(); };   // 押すたびに 0度 ⇔ 90度
$("fsDown").onclick = () => { settings.fs = Math.max(16, settings.fs - 4); saveSettings(); syncButtons(); };
$("fsUp").onclick = () => { settings.fs = Math.min(48, settings.fs + 4); saveSettings(); syncButtons(); };
$("hide").onclick = () => { closeSheet(); closeFaces(); uiHidden = true; $("panel").hidden = true; $("topBtns").hidden = true; $("show").hidden = false; };
$("show").onclick = () => { uiHidden = false; $("panel").hidden = false; $("topBtns").hidden = false; $("show").hidden = true; };
function sendText() { const v = $("txt").value.trim(); if (!v) return; $("txt").value = ""; addLine(v, SONIOX_ON ? (/[ぁ-んァ-ヶ一-龠]/.test(v) ? "ja" : "en") : settings.mode); }   // 自動のときは、文字から日本語か英語かを決める
$("send").onclick = sendText;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendText(); } });


// ================= 顔の保存と認識 =================
const FACE_MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const FKEY = "honyaku.faces";
const FACE_TH = 0.45;        // この距離より近ければ同じ人(小さいほど厳しい。別人と間違えるときは下げる)
const FACE_MARGIN = 0.05;    // 近い人が2人いて、差がこれより小さいときは「判別できない」として未登録扱い
const FACE_UNK_TH = 0.5;     // 未登録の顔を、起動中に同じ人とみなす距離
const FACE_SAMPLES = 5;      // 登録のとき、追加で撮る枚数
const FACE_MS = 300;         // 顔を調べる間隔(ミリ秒。大きいほど軽い)
const FACE_INPUT_FRONT = 320;   // 内カメ(顔が大きく写る)で調べるときの細かさ
const FACE_INPUT_BACK = 576;    // 外カメ(顔が小さく写る)で調べるときの細かさ。32の倍数。大きいほど遠い顔も見つかるが重い
const FACE_SCORE_BACK = 0.35;   // 外カメのときの、顔らしさの下限(小さいほど見つかりやすいが、誤検出も増える)
const sleep = ms => new Promise(r => setTimeout(r, ms));
let uiHidden = false;

function loadFaces() { try { const d = JSON.parse(localStorage.getItem(FKEY)); if (d && d.people) return d; } catch (e) {} return { next: 1, people: [] }; }
let facedb = loadFaces();
const saveFaces = () => { try { localStorage.setItem(FKEY, JSON.stringify(facedb)); } catch (e) { toast("保存できませんでした"); } };
let toastTimer = 0;
function toast(t, ms = 2600) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), ms); }

let faceReady = false, faceLoading = false, faceBusy = false, faceLast = 0, faceMap = new Map(), faceList = [], selFace = null, selSeen = 0;
async function loadFaceModels() {
  if (faceReady || faceLoading) return;
  if (typeof faceapi === "undefined") return toast("顔認識を読み込めませんでした(字幕は使えます)");
  faceLoading = true; toast("顔認識を準備中…(初回は少し時間がかかります)");
  try {
    await Promise.all([faceapi.nets.tinyFaceDetector, faceapi.nets.faceLandmark68Net, faceapi.nets.faceRecognitionNet].map(n => n.loadFromUri(FACE_MODEL_URL)));
    faceReady = true; toast("顔認識の準備ができました");
  } catch (e) { console.warn(e); toast("顔認識を読み込めませんでした(字幕は使えます)"); }
  faceLoading = false;
}

// ---- 照合(以前のスカウターと同じ考え方) ----
function identifyFace(desc) {
  const list = facedb.people.map(p => {
    let d = 9; for (const x of p.descs) d = Math.min(d, faceapi.euclideanDistance(desc, x));
    return { p, d };
  }).sort((a, b) => a.d - b.d);
  const best = list[0], second = list[1];
  const ok = best && best.d < FACE_TH && (!second || second.d - best.d >= FACE_MARGIN);   // 近い人が2人いて決めきれないときは決めない
  return { p: ok ? best.p : null, d: best ? best.d : 9 };
}
let unknowns = [], unkSeq = 0;
function unknownFace(desc) {   // 未登録の顔も、起動中は同じ人なら同じ印にする(選んだ枠が飛ばないように)
  for (const u of unknowns) if (faceapi.euclideanDistance(desc, u.desc) < FACE_UNK_TH) return u;
  const u = { id: ++unkSeq, desc: Array.from(desc) };
  unknowns.push(u); if (unknowns.length > 30) unknowns.shift();
  return u;
}

async function faceDetect() {
  const res = await faceapi.detectAllFaces($("cam"), new faceapi.TinyFaceDetectorOptions(settings.cam === "user" ? { inputSize: FACE_INPUT_FRONT, scoreThreshold: 0.5 } : { inputSize: FACE_INPUT_BACK, scoreThreshold: FACE_SCORE_BACK })).withFaceLandmarks().withFaceDescriptors();
  const now = performance.now(), used = new Set();
  for (const r of res) {
    const m = identifyFace(r.descriptor), p = m.p;
    let key = p ? "p" + p.id : "u" + unknownFace(r.descriptor).id;
    while (used.has(key)) key += "'";
    used.add(key);
    const b = r.detection.box, box = { x: b.x, y: b.y, w: b.width, h: b.height };
    let f = faceMap.get(key);
    if (!f) { f = { key, disp: { ...box } }; faceMap.set(key, f); }
    Object.assign(f, { box, desc: r.descriptor, person: p, d: m.d, seen: now });
  }
  const iou = (a, b) => { const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y); if (w <= 0 || h <= 0) return 0; const i = w * h; return i / (a.w * a.h + b.w * b.h - i); };
  for (const [k, f] of faceMap) {   // 今回見えた顔と同じ場所にいる、前の名前の枠(未登録→登録済みになった直後など)は消す
    if (f.seen === now) continue;
    for (const g of faceMap.values()) if (g.seen === now && iou(f.box, g.box) > 0.4) { faceMap.delete(k); break; }
  }
  for (const [k, f] of faceMap) if (now - f.seen > 1500) faceMap.delete(k);
  faceList = [...faceMap.values()].filter(f => now - f.seen < 1000);
}
function faceTick(now) {
  if (!settings.faceOn || !faceReady || faceBusy || document.hidden) return;
  const v = $("cam"); if (now - faceLast < FACE_MS || v.readyState < 2 || !v.videoWidth) return;
  faceLast = now; faceBusy = true;
  faceDetect().catch(e => console.warn(e)).finally(() => { faceBusy = false; });
}

// ---- 画面の座標への変換(カメラは回さないので、回しているときは字幕の層の座標に直す) ----
function stageRect(b) {
  const cam = $("cam"), W = cam.clientWidth, H = cam.clientHeight, vw = cam.videoWidth, vh = cam.videoHeight;
  const s = (CAM_FIT === "contain" ? Math.min : Math.max)(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  const w = b.w * s, h = b.h * s, Y = b.y * s + oy; let X = b.x * s + ox;
  if (settings.cam === "user") X = W - X - w;   // 内カメは左右を反転して映しているので、枠も合わせる
  return settings.rot === 90 ? { x: Y, y: W - X - w, w: h, h: w } : { x: X, y: Y, w, h };
}
function clientToStage(cx, cy) { return settings.rot === 90 ? [cy, $("cam").clientWidth - cx] : [cx, cy]; }

// ---- 描画: 角の枠、名前札、選んだ顔は赤い枠と走査線 ----
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawFaces(now) {
  const cv = $("faceCv"), st = $("stage"), cw = st.clientWidth, ch = st.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
  if (!settings.faceOn || !$("cam").videoWidth) return;
  if (selFace) { if (faceList.some(f => f.key === selFace)) selSeen = now; else if (now - selSeen > 3000) selFace = null; }   // 3秒映らなければ選択解除
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const f of faceList) {
    for (const k of ["x", "y", "w", "h"]) f.disp[k] += (f.box[k] - f.disp[k]) * 0.35;   // 枠をなめらかに動かす
    const r = f.rect = stageRect(f.disp), sel = selFace === f.key, reg = !!f.person;
    const col = sel ? "#ff6b6b" : reg ? "#7dffb0" : "#d9efe3", k = Math.max(10, Math.min(r.w, r.h) * 0.24);
    ctx.globalAlpha = Math.max(0, Math.min(1, 1 - (now - f.seen - 300) / 500));
    const a0 = ctx.globalAlpha;
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = sel ? 14 : 8; ctx.lineWidth = sel ? 3.5 : 2.5;
    ctx.beginPath();
    for (const [px, py, dx, dy] of [[r.x, r.y, 1, 1], [r.x + r.w, r.y, -1, 1], [r.x, r.y + r.h, 1, -1], [r.x + r.w, r.y + r.h, -1, -1]]) {
      ctx.moveTo(px + dx * k, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * k);
    }
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = a0 * 0.22; ctx.lineWidth = 1; ctx.strokeRect(r.x, r.y, r.w, r.h);   // うすい内側の線
    if (sel) { const y = r.y + r.h * ((now / 900) % 1); ctx.globalAlpha = a0 * 0.7; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(r.x + 4, y); ctx.lineTo(r.x + r.w - 4, y); ctx.stroke(); }   // 走査線
    ctx.globalAlpha = a0;
    const label = (sel ? "▶ " : "") + (reg ? f.person.name : "未登録");
    ctx.font = "600 14px 'Hiragino Sans','Noto Sans JP',sans-serif";
    const tw = ctx.measureText(label).width + 20, th = 24;
    let tx = Math.max(4, Math.min(cw - tw - 4, r.x)), ty = r.y - th - 6; if (ty < 4) ty = r.y + r.h + 6;
    ctx.fillStyle = sel ? "#ff6b6b" : reg ? "rgba(125,255,176,.94)" : "rgba(0,0,0,.55)";
    rr(ctx, tx, ty, tw, th, 12); ctx.fill();
    ctx.fillStyle = sel || reg ? "#04140c" : "#e9fff1"; ctx.textBaseline = "middle"; ctx.fillText(label, tx + 10, ty + th / 2 + 1);
    ctx.globalAlpha = 1;
  }
}

// ---- 枠をタップして選ぶ(もう一度タップ、または枠の外で解除) ----
$("app").addEventListener("click", e => {
  if (e.target.closest("button, input, textarea, #faceInfo")) return;
  const [x, y] = clientToStage(e.clientX, e.clientY);
  let hit = null;
  for (const f of faceList) { const r = f.rect; if (r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h && (!hit || r.w * r.h < hit.rect.w * hit.rect.h)) hit = f; }   // 重なっていたら小さい方
  if (hit && hit.key !== selFace) { selFace = hit.key; selSeen = performance.now(); } else selFace = null;
});

// ---- 選んだ顔の情報カード ----
let infoSig = "";
function renderFaceInfo() {
  const el = $("faceInfo"), f = selFace && faceList.find(x => x.key === selFace);
  if (!f || uiHidden || !settings.faceOn) { if (!el.hidden) el.hidden = true; infoSig = ""; return; }
  const p = f.person, memo = p ? (p.memo || "").trim() : "", sig = f.key + "|" + (p ? p.name + "|" + memo : "");
  if (sig !== infoSig) {
    infoSig = sig;
    const name = p ? p.name : "未登録", hue = p ? (p.id * 47) % 360 : 150;
    const body = memo ? esc(memo.length > 120 ? memo.slice(0, 120) + "…" : memo) : (p ? "メモはまだありません" : "顔を登録すると、名前とメモを残せます");
    el.innerHTML = `<div class="avatar" style="--h:${hue}">${esc(p ? Array.from(name)[0] : "?")}</div>
      <div class="fbody"><div class="fname"><span class="n">${esc(name)}</span><span class="chip${p ? " ok" : ""}">${p ? "登録済み" : "未登録"}</span></div>
      <div class="fmemo${memo ? "" : " none"}">${body}</div></div>
      <button class="mini" data-act="${p ? "memo" : "reg"}">${p ? "メモ" : "登録"}</button>`;
  }
  el.hidden = false;
}
$("faceInfo").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const f = selFace && faceList.find(x => x.key === selFace); if (!f) return;
  if (b.dataset.act === "reg") registerFace(); else if (f.person) openFaces(f.person.id);
});

// ---- 登録(数回に分けて撮って、角度や表情の違いも覚えさせる) ----
let registering = false;
async function registerFace() {
  if (registering) return;
  if (!settings.faceOn) return toast("顔認識がOFFです。設定でONにしてください");
  if (!faceReady) return toast("顔認識の準備中です。少し待ってください");
  const target = faceList.find(f => f.key === selFace) || faceList.slice().sort((a, b) => b.box.w * b.box.h - a.box.w * a.box.h)[0];   // 選んだ顔、なければ一番大きい顔
  if (!target) return toast("顔が見つかりません。顔を映してから押してください");
  if (target.person && !confirm("この顔は「" + target.person.name + "」として認識されています。別人として新しく登録しますか?")) return;
  registering = true; toast("登録中…顔を少しずつ動かしながら映してください", 2200);
  const base = target.desc, samples = [Array.from(base)];
  for (let i = 0; i < FACE_SAMPLES; i++) {
    await sleep(350);
    let best = null, bd = 9;
    for (const f of faceList) { const d = faceapi.euclideanDistance(base, f.desc); if (d < bd) { bd = d; best = f; } }
    if (best && bd < 0.6 && !samples.some(x => faceapi.euclideanDistance(x, best.desc) < 0.02)) samples.push(Array.from(best.desc));
  }
  const id = facedb.next++;
  facedb.people.push({ id, name: "名無し" + String(id).padStart(3, "0"), descs: samples, memo: "", created: Date.now() });
  saveFaces();
  if (selFace === target.key) selFace = "p" + id;
  toast("登録しました(サンプル" + samples.length + "枚)。名前とメモは「顔の一覧」で書けます", 3200);
  registering = false;
}

// ---- 顔の一覧(名前の変更、メモ、削除) ----
function renderFaces() {
  $("fCount").textContent = facedb.people.length;
  $("fList").innerHTML = facedb.people.length ? facedb.people.map(p => `<div class="pcard" data-id="${p.id}">
      <div class="avatar" style="--h:${(p.id * 47) % 360}">${esc(Array.from(p.name)[0] || "?")}</div>
      <div class="pbody">
        <div class="pname"><b>${esc(p.name)}</b><button class="mini" data-act="rename">名前変更</button><button class="mini danger" data-act="del">削除</button></div>
        <div class="pmeta">${p.created ? "登録 " + new Date(p.created).toLocaleDateString("ja-JP") : "登録済み"}</div>
        <textarea class="memo" maxlength="500" placeholder="メモ" aria-label="${esc(p.name)}のメモ">${esc(p.memo || "")}</textarea>
      </div></div>`).join("")
    : '<div class="fEmpty">まだ登録がありません。<br>顔を映して「顔を登録」を押してください。</div>';
}
function openFaces(focusId) {
  closeSheet();
  const s = $("facesheet"); renderFaces();
  s.hidden = false; s.classList.remove("closing"); void s.offsetWidth; s.classList.add("open");
  if (focusId) setTimeout(() => { const t = $("fList").querySelector(`.pcard[data-id="${focusId}"] textarea`); if (t) { t.scrollIntoView({ block: "center" }); t.focus(); } }, 350);
}
function closeFaces() {
  const s = $("facesheet"); if (s.hidden) return;
  saveFaces(); s.classList.add("closing"); s.classList.remove("open");
  setTimeout(() => { if (s.classList.contains("closing")) { s.hidden = true; s.classList.remove("closing"); } }, 260);
}
$("fList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = +b.closest(".pcard").dataset.id, p = facedb.people.find(x => x.id === id); if (!p) return;
  if (b.dataset.act === "rename") { const n = prompt("名前を入力してください", p.name); if (n && n.trim()) { p.name = n.trim().slice(0, 20); saveFaces(); renderFaces(); infoSig = ""; } }
  if (b.dataset.act === "del" && confirm("「" + p.name + "」を削除します。よろしいですか?")) { facedb.people = facedb.people.filter(x => x.id !== id); saveFaces(); renderFaces(); infoSig = ""; }
});
let memoTimer = 0;
$("fList").addEventListener("input", e => {
  if (!e.target.classList.contains("memo")) return;
  const p = facedb.people.find(x => x.id === +e.target.closest(".pcard").dataset.id); if (!p) return;
  p.memo = e.target.value.slice(0, 500); clearTimeout(memoTimer); memoTimer = setTimeout(() => { saveFaces(); infoSig = ""; }, 400);
});
$("fList").addEventListener("focusout", e => { if (e.target.classList.contains("memo")) saveFaces(); });
$("fWipe").onclick = () => { if (confirm("登録した顔データをすべて削除します。よろしいですか?")) { facedb = { next: 1, people: [] }; saveFaces(); renderFaces(); infoSig = ""; toast("削除しました"); } };
$("fClose").onclick = closeFaces; $("fBackdrop").onclick = closeFaces;
$("regBtn").onclick = registerFace;
$("facesBtn").onclick = () => $("facesheet").hidden || $("facesheet").classList.contains("closing") ? openFaces() : closeFaces();
$("faceOnBtn").onclick = () => {
  settings.faceOn = !settings.faceOn; saveSettings(); syncButtons();
  if (settings.faceOn) loadFaceModels(); else { faceList = []; faceMap.clear(); selFace = null; }
};
addEventListener("pagehide", saveFaces);
function faceLoop(now) { faceTick(now); drawFaces(now); renderFaceInfo(); requestAnimationFrame(faceLoop); }
requestAnimationFrame(faceLoop);



// ================= 物体認識(コップ・スマホなどに枠と名前を出す) =================
// ここは、ほかの機能から切り離してあります。いらなくなったら、次の3か所を消せば、きれいに外せます。
//   (1) この「物体認識」の区画ぜんぶ  (2) <canvas id="objCv"> と #objCv のCSS  (3) 設定シートの #objOnBtn ボタン
// (syncButtons の1行も消してください。「物体認識」で検索すると見つかります)
const OBJ_URL_TF = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js";
const OBJ_URL_COCO = "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js";
const OBJ_MS = 700;        // 物体を調べる間隔(ミリ秒。大きいほど軽い)
const OBJ_SCORE = 0.45;    // この自信より低いものは出さない(下げると増えるが、間違いも増える)
const OBJ_MAX = 6;         // 一度に出す物体の数の上限
const OBJ_IGNORE = ["person"];   // 出さないもの(人は、顔認識の枠があるので出さない)
const OBJ_JA = { bicycle: "自転車", car: "車", motorcycle: "バイク", airplane: "飛行機", bus: "バス", train: "電車", truck: "トラック", boat: "ボート",
  "traffic light": "信号機", "fire hydrant": "消火栓", "stop sign": "一時停止標識", "parking meter": "パーキングメーター", bench: "ベンチ", bird: "鳥", cat: "猫", dog: "犬",
  horse: "馬", sheep: "羊", cow: "牛", elephant: "象", bear: "クマ", zebra: "シマウマ", giraffe: "キリン", backpack: "リュック", umbrella: "傘", handbag: "ハンドバッグ",
  tie: "ネクタイ", suitcase: "スーツケース", frisbee: "フリスビー", skis: "スキー板", snowboard: "スノーボード", "sports ball": "ボール", kite: "凧", "baseball bat": "バット",
  "baseball glove": "グローブ", skateboard: "スケートボード", surfboard: "サーフボード", "tennis racket": "ラケット", bottle: "ボトル", "wine glass": "ワイングラス", cup: "コップ",
  fork: "フォーク", knife: "ナイフ", spoon: "スプーン", bowl: "ボウル", banana: "バナナ", apple: "りんご", sandwich: "サンドイッチ", orange: "オレンジ", broccoli: "ブロッコリー",
  carrot: "にんじん", "hot dog": "ホットドッグ", pizza: "ピザ", donut: "ドーナツ", cake: "ケーキ", chair: "椅子", couch: "ソファ", "potted plant": "観葉植物", bed: "ベッド",
  "dining table": "テーブル", toilet: "トイレ", tv: "テレビ", laptop: "ノートPC", mouse: "マウス", remote: "リモコン", keyboard: "キーボード", "cell phone": "スマホ",
  microwave: "電子レンジ", oven: "オーブン", toaster: "トースター", sink: "流し台", refrigerator: "冷蔵庫", book: "本", clock: "時計", vase: "花瓶", scissors: "はさみ",
  "teddy bear": "ぬいぐるみ", "hair drier": "ドライヤー", toothbrush: "歯ブラシ" };

let objModel = null, objLoading = false, objBusy = false, objLast = 0, objList = [];
function loadScriptOnce(src) { return new Promise((ok, ng) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => ng(new Error("script " + src)); document.head.appendChild(el); }); }
async function loadObjModel() {   // 使うときになってから読み込む(OFFのときは、読み込まないので軽い)
  if (objModel || objLoading) return;
  objLoading = true; toast("物体認識を準備中…(初回は少し時間がかかります)");
  try {
    if (typeof tf === "undefined") await loadScriptOnce(OBJ_URL_TF);
    if (typeof cocoSsd === "undefined") await loadScriptOnce(OBJ_URL_COCO);
    objModel = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    toast("物体認識の準備ができました");
  } catch (e) { console.warn(e); toast("物体認識を読み込めませんでした(ほかの機能は使えます)"); settings.objOn = false; saveSettings(); syncButtons(); }
  objLoading = false;
}
function objectTick(now) {
  const v = $("cam");
  if (!settings.objOn || !objModel || objBusy || document.hidden || now - objLast < OBJ_MS || v.readyState < 2 || !v.videoWidth) return;
  objBusy = true; objLast = now;
  objModel.detect(v, 12, OBJ_SCORE).then(preds => {
    const t = performance.now();
    objList = preds.filter(p => !OBJ_IGNORE.includes(p.class)).slice(0, OBJ_MAX).map(p => {
      const [x, y, w, h] = p.bbox, box = { x, y, w, h };
      const faceHit = faceList.some(f => { const a = f.box, ix = Math.min(a.x + a.w, x + w) - Math.max(a.x, x), iy = Math.min(a.y + a.h, y + h) - Math.max(a.y, y); return ix > 0 && iy > 0 && ix * iy > 0.5 * a.w * a.h; });   // 顔と重なるものは出さない
      return faceHit ? null : { name: OBJ_JA[p.class] || p.class, score: p.score, box, seen: t };
    }).filter(Boolean);
  }).catch(e => console.warn(e)).finally(() => { objBusy = false; });
}
function drawObjects(now) {
  const cv = $("objCv"), st = $("stage"), cw = st.clientWidth, ch = st.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
  if (!settings.objOn || !$("cam").videoWidth) return;
  const t = performance.now();
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.font = "600 13px 'Hiragino Sans','Noto Sans JP',sans-serif"; ctx.textBaseline = "middle";
  for (const o of objList) {
    const age = t - o.seen; if (age > 1800) continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, 1 - (age - 900) / 900));
    const r = stageRect(o.box), col = "#ffd24a";
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
    rr(ctx, r.x, r.y, r.w, r.h, 8); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
    const label = o.name + " " + Math.round(o.score * 100) + "%", tw = ctx.measureText(label).width + 16, th = 22;
    const tx = Math.max(4, Math.min(cw - tw - 4, r.x)); let ty = r.y - th - 4; if (ty < 4) ty = r.y + 4;
    ctx.fillStyle = "rgba(255,210,74,.94)"; rr(ctx, tx, ty, tw, th, 11); ctx.fill();
    ctx.fillStyle = "#241a00"; ctx.fillText(label, tx + 8, ty + th / 2 + 1);
  }
  ctx.globalAlpha = 1;
}
$("objOnBtn").onclick = () => {
  settings.objOn = !settings.objOn; saveSettings(); syncButtons();
  if (settings.objOn) loadObjModel(); else objList = [];
};
function objectLoop(now) { objectTick(now); drawObjects(now); requestAnimationFrame(objectLoop); }
if (settings.objOn) loadObjModel();
requestAnimationFrame(objectLoop);

// ================= Sonioxで、日本語と英語を自動で聞き分けて、双方向に翻訳 =================
const CODE_KEY = "honyaku.code";
let sonioxOn = false, sonioxRec = null, soniClient = null, soniLastTok = 0, soniIdleTimer = 0, endTimer = 0;
function emptyLive() { return { srcF: "", srcN: "", dstF: "", dstN: "", lang: null, none: false, ended: false }; }   // F = 確定した部分 / N = まだ変わるかもしれない部分
let live = emptyLive();
const liveHasText = () => !!(live.srcF || live.srcN || live.dstF || live.dstN);
function liveItem() { return liveHasText() ? { src: live.srcF + live.srcN, dst: (live.dstF + live.dstN) || null, mode: live.lang === "ja" ? "ja" : "en", err: null } : null; }
function resetLive() { clearTimeout(endTimer); live = emptyLive(); }
function commitLive() {   // 1つの発話を、確定した1行として画面に残す
  clearTimeout(endTimer);
  const src = (live.srcF + live.srcN).trim(), dst = (live.dstF + live.dstN).trim(), mode = live.lang === "ja" ? "ja" : "en";
  live = emptyLive();
  if (!src) { render(); return; }
  lines.push({ src, dst, err: null, mode });
  if (lines.length > MAX_LINES * 3) lines.shift();
  render();
  if (dst) speakText(dst, MODES[mode].speak);
}
function handleTokens(tokens) {
  let srcN = "", dstN = "";
  for (const t of tokens) {
    const txt = t.text || "";
    if (txt === "<fin>") continue;
    if (txt === "<end>") { live.ended = true; clearTimeout(endTimer); endTimer = setTimeout(commitLive, 1500); continue; }   // 発話の区切り。遅れて届く翻訳を待つため、少し置いてから確定する
    const st = t.translation_status || "none";
    if (st !== "translation" && live.ended) commitLive();   // 次の発話が始まったので、前の発話を確定する
    if (st === "translation") { if (t.is_final) live.dstF += txt; else dstN += txt; }
    else {
      if (!live.lang && t.language) live.lang = t.language;
      if (st === "none") live.none = true;
      if (t.is_final) live.srcF += txt; else srcN += txt;
    }
  }
  live.srcN = srcN; live.dstN = dstN;   // まだ変わるかもしれない部分は、届くたびに入れかえる
  render();
}
function getAccessCode() {
  let c = ""; try { c = localStorage.getItem(CODE_KEY) || ""; } catch (e) {}
  if (!c) { c = (prompt("合言葉を入力してください(中継に設定したもの)") || "").trim(); if (c) { try { localStorage.setItem(CODE_KEY, c); } catch (e) {} } }
  return c;
}
async function fetchTmpKey() {   // 短い時間だけ使える鍵を、中継からもらう
  if (!/^https:\/\//.test(TMP_KEY_URL)) throw new Error("TMP_KEY_URLが https:// で始まっていません。今の値: " + TMP_KEY_URL);
  let r;
  try { r = await fetch(TMP_KEY_URL, { method: "POST", headers: { "X-Access-Code": getAccessCode() } }); }
  catch (e) { throw new Error("中継につながりません(アドレス違い・オフライン・許可されていないサイト)"); }
  if (r.status === 401) { try { localStorage.removeItem(CODE_KEY); } catch (e) {} throw new Error("合言葉が違います。もう一度「聞く」を押して、入れ直してください"); }
  if (!r.ok) {
    let code = ""; try { code = (await r.json()).error || ""; } catch (e) {}
    const hint = { 405: "アドレスがWorkerではない可能性(TMP_KEY_URLを確認)", 403: "このサイトのアドレスが許可されていません(ALLOWED_ORIGINS)", 500: "Workerの秘密(SONIOX_API_KEY/ACCESS_CODE)が未設定", 502: "Sonioxが鍵発行を断りました(APIキーの権限を確認)", 404: "アドレス違い" }[r.status] || "";
    throw new Error("鍵をもらえませんでした(" + r.status + (code ? " " + code : "") + ") " + hint);
  }
  return (await r.json()).api_key;
}
async function startSoniox() {
  if (!window.SonioxClient) return toast("Sonioxを読み込めませんでした。ページを開き直してください");
  if (!getAccessCode()) return;
  sonioxOn = true; syncButtons(); setStatus("つないでいます…", false, true); keepAwake(true);
  try {
    soniClient = soniClient || new window.SonioxClient({ api_key: fetchTmpKey });
    const cfg = {
      model: "stt-rt-v5", language_hints: ["ja", "en"], enable_language_identification: true, enable_endpoint_detection: true,
      translation: { type: "two_way", language_a: "ja", language_b: "en" },   // 日本語が聞こえたら英語に、英語が聞こえたら日本語に
      auto_reconnect: true
    };
    if (STT_TERMS.length) cfg.context = { terms: STT_TERMS };
    const rec = soniClient.realtime.record(cfg);
    sonioxRec = rec; soniLastTok = Date.now();
    rec.on("result", r => { soniLastTok = Date.now(); handleTokens(r.tokens || []); });
    rec.on("endpoint", () => { live.ended = true; clearTimeout(endTimer); endTimer = setTimeout(commitLive, 1500); });
    rec.on("state_change", s => {
      const st = String((s && (s.new_state || s.state)) || s || "");
      if (!sonioxOn || rec !== sonioxRec) return;
      if (/record/.test(st)) setStatus("聞いています(日本語 ⇄ 英語)", false, true);
      else if (/connect|start/.test(st)) setStatus("つないでいます…", false, true);
      else if (/pause/.test(st)) setStatus("一時停止中");
    });
    rec.on("error", e => { console.warn(e); if (rec === sonioxRec) stopSoniox("音声認識のエラー: " + ((e && e.message) || e), true); });
    clearInterval(soniIdleTimer);
    soniIdleTimer = setInterval(() => { if (sonioxOn && Date.now() - soniLastTok > SONIOX_IDLE_MS) stopSoniox("しばらく音がなかったので、料金がかからないよう止めました", true); }, 10000);
  } catch (e) { console.warn(e); stopSoniox(String((e && e.message) || e), true); }
}
function stopSoniox(message, warn) {
  sonioxOn = false; clearInterval(soniIdleTimer);
  const rec = sonioxRec; sonioxRec = null;
  if (rec) {
    try { Promise.resolve(rec.stop()).catch(() => {}).finally(commitLive); }   // 止める前の最後の言葉まで受け取ってから、確定する
    catch (e) { try { rec.cancel(); } catch (e2) {} commitLive(); }
  } else commitLive();
  keepAwake(false); syncButtons(); setStatus(message || "停止中", !!warn);
}
$("mAuto").onclick = () => sonioxOn ? stopSoniox() : startSoniox();
document.addEventListener("visibilitychange", () => { if (!document.hidden && sonioxOn) keepAwake(true); });
$("mAuto").hidden = !SONIOX_ON; $("mEn").hidden = SONIOX_ON; $("mJa").hidden = SONIOX_ON;   // 自動のときは、言語のボタンは1つにまとめる

syncButtons(); render(); layoutStage(); startCamera();
if (!SR) setStatus("このブラウザは音声認識に対応していません。iPhoneのSafariで開いてください。(テスト用の入力欄は使えます)", true);
</script>
